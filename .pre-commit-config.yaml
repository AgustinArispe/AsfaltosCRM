minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --config backend/pyproject.toml
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check --config backend/pyproject.toml
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict
        entry: mypy --config-file backend/pyproject.toml --strict backend/app backend/tests backend/performance backend/quality
        language: system
        pass_filenames: false
        files: ^backend/(app|tests|performance|quality)/
      - id: biome
        name: Biome lint and format check
        entry: npm --prefix frontend run check
        language: system
        pass_filenames: false
        files: ^frontend/(src/|biome\.json$|package(-lock)?\.json$|tsconfig.*\.json$|vite\.config\.ts$)
