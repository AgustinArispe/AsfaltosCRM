minimum_pre_commit_version: "4.0.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: ruff check --config backend/pyproject.toml
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format check
        entry: ruff format --check --config backend/pyproject.toml
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy strict
        entry: mypy --config-file backend/pyproject.toml --strict backend/app backend/tests
        language: system
        pass_filenames: false
        files: ^backend/(app|tests)/
