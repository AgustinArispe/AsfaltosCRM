name: pulse-crm-demo

services:
  db:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: pulse_demo
      POSTGRES_USER: pulse_demo
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Run scripts/pulse-demo.sh first}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pulse_demo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse_demo -d pulse_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: quality
    environment:
      APP_ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://pulse_demo:${DEMO_POSTGRES_PASSWORD}@db:5432/pulse_demo
      JWT_SECRET: ${DEMO_JWT_SECRET:?Run scripts/pulse-demo.sh first}
      WEB_INTAKE_SIGNING_SECRET: ${DEMO_WEB_INTAKE_SECRET:?Run scripts/pulse-demo.sh first}
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,testserver
      CORS_ALLOWED_ORIGINS: ""
      WHATSAPP_PROVIDER: fake
      WHATSAPP_DEV_ROUTES_ENABLED: "false"
      WHATSAPP_MEDIA_STORAGE: filesystem
      WHATSAPP_MEDIA_STORAGE_ROOT: /var/lib/pulse-crm/whatsapp-media
      META_ACCESS_TOKEN: ""
      META_PHONE_NUMBER_ID: ""
      META_WABA_ID: ""
      META_WEBHOOK_VERIFY_TOKEN: ""
      META_APP_SECRET: ""
    command: /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - pulse_demo_media:/var/lib/pulse-crm/whatsapp-media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: /api
    ports:
      - "127.0.0.1:15173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pulse_demo_postgres:
  pulse_demo_media:
