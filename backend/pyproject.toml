[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["app", "tests", "performance"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["app", "tests", "performance"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ARG",
    "RET",
    "TRY",
]
ignore = [
    # Domain and validation messages belong at their explicit raise sites.
    "TRY003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Query",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 93
precision = 2
show_missing = true
