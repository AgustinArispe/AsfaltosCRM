<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/pulse-brand-favicon.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/pulse-brand-touch.png" sizes="180x180" />
    <meta name="theme-color" content="#F4C20D" />
    <meta name="description" content="PULSE CRM — Seguí el ritmo de tus ventas" />
    <link
      rel="preload"
      href="/fonts/manrope-latin-400-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSE CRM | Seguí el ritmo de tus ventas</title>
    <script>
      (() => {
        const stored = localStorage.getItem('faa-crm.theme')
        const preference = stored === 'light' || stored === 'dark' ? stored : 'system'
        const resolved =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
