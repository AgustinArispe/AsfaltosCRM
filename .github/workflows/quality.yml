name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://asfaltos:ci_password@localhost:5432/asfaltos_crm
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ALLOWED_HOSTS: localhost,testserver
      WEB_INTAKE_SIGNING_SECRET: ci-only-intake-secret-with-thirty-two-characters
      STALE_OPPORTUNITY_DAYS: "14"
      WHATSAPP_PROVIDER: fake
      WHATSAPP_MEDIA_STORAGE: fake
    services:
      postgres:
        # PostgreSQL 17.10 Alpine
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: asfaltos_crm
          POSTGRES_USER: asfaltos
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asfaltos -d asfaltos_crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock
      - name: Install locked backend dependencies
        run: >-
          python -m pip install --disable-pip-version-check --require-hashes
          -r requirements.lock -r requirements-dev.lock
      - name: Verify reproducible Python locks
        run: ./scripts/verify-locks.sh
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Ruff lint
        run: ruff check app tests performance quality
      - name: Ruff format check
        run: ruff format --check app tests performance quality
      - name: Mypy strict
        run: mypy --strict app tests performance quality
      - name: Backend tests and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=93
      - name: Python bytecode compilation
        run: python -m compileall -q app tests performance quality
      - name: Verify Alembic model state
        run: alembic check
      - name: Verify Alembic head
        run: alembic current --check-heads
      - name: Audit locked Python dependencies
        run: python -m quality.audit_dependencies --output artifacts/pip-audit.json
      - name: Upload Python audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pip-audit-report
          path: backend/artifacts/pip-audit.json
          if-no-files-found: warn
          retention-days: 7

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Biome lint and format check
        run: npm run check
      - name: Frontend tests and coverage
        run: npm run coverage
      - name: Upload frontend coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
          retention-days: 7
      - name: TypeScript and Vite build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  docker-compose-smoke:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build, start, verify, and stop Compose services
        run: ./scripts/ci-compose-smoke.sh
