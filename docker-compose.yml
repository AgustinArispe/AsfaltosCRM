services:
  db:
    # PostgreSQL 17.10 Alpine
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      target: quality
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,testserver}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      WEB_INTAKE_SIGNING_SECRET: ${WEB_INTAKE_SIGNING_SECRET:?WEB_INTAKE_SIGNING_SECRET is required}
      STALE_OPPORTUNITY_DAYS: ${STALE_OPPORTUNITY_DAYS:-14}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-fake}
      WHATSAPP_DEV_ROUTES_ENABLED: ${WHATSAPP_DEV_ROUTES_ENABLED:-false}
      WHATSAPP_MEDIA_STORAGE: ${WHATSAPP_MEDIA_STORAGE:-filesystem}
      WHATSAPP_MEDIA_STORAGE_ROOT: ${WHATSAPP_MEDIA_STORAGE_ROOT:-/var/lib/asfaltos-crm/whatsapp-media}
      WHATSAPP_IMAGE_MAX_BYTES: ${WHATSAPP_IMAGE_MAX_BYTES:-16777216}
      WHATSAPP_DOCUMENT_MAX_BYTES: ${WHATSAPP_DOCUMENT_MAX_BYTES:-16777216}
      WHATSAPP_IMAGE_MIME_TYPES: ${WHATSAPP_IMAGE_MIME_TYPES:-image/jpeg,image/png,image/webp}
      WHATSAPP_DOCUMENT_MIME_TYPES: ${WHATSAPP_DOCUMENT_MIME_TYPES:-application/pdf}
      WHATSAPP_BROADCAST_BATCH_SIZE: ${WHATSAPP_BROADCAST_BATCH_SIZE:-10}
      WHATSAPP_BROADCAST_CLAIM_TIMEOUT_SECONDS: ${WHATSAPP_BROADCAST_CLAIM_TIMEOUT_SECONDS:-300}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_REQUEST_TIMEOUT_SECONDS: ${META_REQUEST_TIMEOUT_SECONDS:-10}
      META_RETRY_MAX_ATTEMPTS: ${META_RETRY_MAX_ATTEMPTS:-3}
      META_RETRY_BASE_SECONDS: ${META_RETRY_BASE_SECONDS:-0.25}
      META_RETRY_MAX_SECONDS: ${META_RETRY_MAX_SECONDS:-2}
    command: >
      /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - whatsapp_media:/var/lib/asfaltos-crm/whatsapp-media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:5173').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  whatsapp_media:
